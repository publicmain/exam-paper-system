server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # S2 的证据面：每个响应都带这个头，用来证明「这个 URL 由 spike 服务
  # 应答」。旧端不会有它。
  add_header X-Spike-Service "student-web-origin" always;

  # 一次性 spike，永远不要被任何一层缓存住 —— 包括真机上可能存在的
  # 旧 Service Worker。它的作用域在旧源上，理论上管不到这里，但
  # no-store 让「有没有被缓存」这件事在 S3 里不成为混淆变量。
  add_header Cache-Control "no-store" always;

  # SPA 兜底：深层路径（如 /app/today）也回同一个 index.html。
  # 这是 S2 要验的一条 —— 新端将来是 SPA，深层路径必须能直接打开。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
