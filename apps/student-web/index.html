<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>每日英语</title>
    <!--
      可安装（2026-09-10）。只为一件事：iPhone / iPad 上的浏览器推送
      **必须**把网页加到主屏幕才收得到。manifest 里没有任何缓存策略，
      Service Worker 也只管推送 —— 见 public/sw.js 头注释。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#007aff" />
    <!--
      外观（2026-09-16）。学生在「账号 → 外观」选了固定的一档时，**必须在第一次绘制
      之前**把 data-theme 打上，否则暗色用户每次开应用都先闪一下白。

      所以这段是内联的、是 ES5 的、而且不等任何模块：
        · 内联 —— 外部脚本要一次网络往返，那时候白屏已经画出来了。
        · ES5（var / function，没有箭头函数）—— 学生的旧 iPad Safari 也要跑得动，
          而且这段不经过打包器转译。
      键名 `sw:theme` 与 src/lib/theme.ts 是同一个，contract 测试钉住了这一点。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sw:theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && t === 'dark') m.setAttribute('content', '#0e0e11');
        } catch (e) {
          /* 隐私模式读不到就按跟随系统来 */
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="每日英语" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
