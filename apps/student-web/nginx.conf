server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 压缩（2026-09-21）。徽章的三维模型是纯网格数据、没有贴图，压缩率极高：
  # reading-1.glb 1.84 MB → 0.82 MB。之前完全没开压缩，学生第一次打开颁奖
  # 要下近两兆，真机诊断量到 ready 用了 4.9 秒，慢一点直接超时降级成图片。
  #
  # 构建时已经生成 .gz（见 Dockerfile），gzip_static 直接发预压缩文件：
  # 压缩比更高、运行时零 CPU。没有 .gz 的再走即时压缩。
  gzip_static on;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  # .glb 在默认 MIME 表里没有条目，会落进 application/octet-stream —— 所以这里
  # 压的是 octet-stream。**不要**在这儿写 types{}：server 级的 types 会整张覆盖
  # 默认 MIME 表，JS / CSS 的类型会一起被搞坏。
  gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;

  # 身份标记。用来在实测时一眼确认「这个 URL 由新端应答」。
  #
  # 刻意**不沿用** spike 的 X-Spike-Service —— 那是一次性验证件的身份，
  # 真应用不该顶着它。拓扑照抄（已验证过），身份重新给。
  add_header X-Student-App "v2" always;

  # index.html 绝不缓存。
  #
  # SPA 的入口一旦被缓存住，学生会在新版本发布之后继续拿到旧的 index，
  # 而它引用的 hashed 资源可能已经不存在了 —— 表现是白屏，且刷新无效。
  # 这是 SPA 部署最常见的陷阱，用 no-store 从源头掐掉。
  location = /index.html {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
  }

  # 指纹化的静态资源反过来 —— 文件名带内容哈希，内容变了文件名就变了，
  # 所以可以放心长期不可变缓存。
  location /assets/ {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # 版本化徽章素材可协商缓存；缺失模型必须 404，不能伪装成 SPA HTML。
  location /medals/ {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  # SPA 兜底：任意深层路径都回 index.html，交给前端路由。
  # 未知路径由 App 的 `*` 兜底决定去 /today 还是 /login。
  location / {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
