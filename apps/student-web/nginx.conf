server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 身份标记。用来在实测时一眼确认「这个 URL 由新端应答」。
  #
  # 刻意**不沿用** spike 的 X-Spike-Service —— 那是一次性验证件的身份，
  # 真应用不该顶着它。拓扑照抄（已验证过），身份重新给。
  add_header X-Student-App "v2" always;

  # index.html 绝不缓存。
  #
  # SPA 的入口一旦被缓存住，学生会在新版本发布之后继续拿到旧的 index，
  # 而它引用的 hashed 资源可能已经不存在了 —— 表现是白屏，且刷新无效。
  # 这是 SPA 部署最常见的陷阱，用 no-store 从源头掐掉。
  location = /index.html {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
  }

  # 指纹化的静态资源反过来 —— 文件名带内容哈希，内容变了文件名就变了，
  # 所以可以放心长期不可变缓存。
  location /assets/ {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA 兜底：任意深层路径都回 index.html，交给前端路由。
  # 未知路径由 App 的 `*` 兜底决定去 /today 还是 /login。
  location / {
    add_header X-Student-App "v2" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
